name: Validate curriculum and completed work
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore HundredDays.slnx
      - run: dotnet build HundredDays.slnx --no-restore --configuration Release
      - run: ./scripts/Smoke-Examples.ps1
        shell: pwsh
      - run: py -3 scripts/validate_curriculum.py
      - run: ./scripts/Test-Completed.ps1 -IncludeInfrastructure -Configuration Release
        shell: pwsh

